[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-sim"
version = "0.1.0"
description = "Fixed-wing UAV flight dynamics, robust control, and optimisation simulator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "black>=23.0",
    "matplotlib>=3.8",
    "mypy>=1.7",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
]
opt = ["cma>=3.3"]
ml = ["scikit-learn>=1.3"]
mc = [
    "pandas>=2.1",
    "pyarrow>=14.0",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["uav_sim"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gate: phase exit criteria",
    "slow: long-running campaign tests",
]
